[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openfotos"
version = "0.1.3"
description = "Private event photo delivery and face-based discovery pilot"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "OneNodeAI" }]
requires-python = ">=3.12,<3.15"
dependencies = []

[project.optional-dependencies]
server = [
  "argon2-cffi>=23.1,<26",
  "boto3>=1.35,<2",
  "dj-database-url>=2.2,<4",
  "django>=5.2,<5.3",
  "pillow>=11,<13",
  "gunicorn>=23,<24",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<6",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pillow-heif>=1.1,<2",
  "whitenoise>=6.8,<7",
]
desktop = [
  "httpx>=0.28,<1",
  "keyring>=25.6,<26",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<6",
  "pillow>=11,<13",
  "pillow-heif>=1.1,<2",
  "pyside6>=6.8,<7",
]
vision = [
  "insightface>=0.7.3,<0.8",
  "numpy>=1.26,<3",
  "onnxruntime>=1.20,<2",
  "opencv-python-headless>=4.10,<6",
  "pillow>=11,<13",
  "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pytest-django>=4.10,<5",
  "ruff>=0.9,<1",
]
packaging = [
  "pip-licenses==5.5.5",
  "pyinstaller==6.22.3",
]

[tool.hatch.build.targets.wheel]
packages = [
  "apps/desktop/src/openfotos_desktop",
  "apps/server/src/openfotos_server",
  "packages/contracts/src/openfotos_contracts",
  "packages/storage/src/openfotos_storage",
  "packages/vision/src/openfotos_vision",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "openfotos_server.settings"

[tool.coverage.run]
branch = true
source = [
  "openfotos_contracts",
  "openfotos_storage",
  "openfotos_vision",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "apps/desktop/src",
  "apps/server/src",
  "packages/contracts/src",
  "packages/storage/src",
  "packages/vision/src",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
