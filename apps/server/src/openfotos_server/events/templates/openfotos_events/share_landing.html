{% extends "openfotos_events/base.html" %}
{% load static %}

{% block title %}Open private gallery · OpenFotos{% endblock %}

{% block content %}
<section class="card narrow" data-share-landing>
  <p class="eyebrow">Private gallery</p>
  <h1>Opening your gallery…</h1>
  <p class="muted" data-share-status>Checking the private link in this browser.</p>
  <form method="post" action="{{ present_url }}" data-share-present-form>
    {% csrf_token %}
    <input type="hidden" name="secret" value="" data-share-secret>
    <noscript><p class="form-error">JavaScript is required to open this privacy-preserving link.</p></noscript>
  </form>
</section>
<script src="{% static 'openfotos_events/share.js' %}" defer></script>
{% endblock %}
